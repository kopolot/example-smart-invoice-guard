name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

env:
  XDEBUG_MODE: off
  COMPOSE_FILE: compose.yaml:compose.ci.yaml
  # Isolate from a developer's local compose project name (directory-based).
  COMPOSE_PROJECT_NAME: sig-ci

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export host UID/GID for compose
        run: |
          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"

      # Reuse compose.yaml — no duplicated service definitions.
      # --no-deps skips proxysql/PXC/nginx (PHPUnit uses SQLite in-memory).
      - name: Start CI services
        run: docker compose up -d --build --no-deps --wait php redis elasticsearch rabbitmq

      - name: Install PHP dependencies
        # apk's /usr/bin/composer wraps php85 (missing extensions) — use image PHP + phar.
        run: docker compose exec -T -e XDEBUG_MODE=off php /usr/local/bin/php /usr/bin/composer.phar install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        # package-lock.json is gitignored in this repo — cannot use npm ci on a fresh checkout.
        run: docker compose exec -T php npm install

      - name: Prepare application
        run: |
          docker compose exec -T php sh -lc 'test -f .env || cp .env.example .env'
          docker compose exec -T -e XDEBUG_MODE=off php php artisan key:generate --no-interaction

      - name: Build assets
        run: docker compose exec -T php npm run build

      - name: Run tests
        run: docker compose exec -T -e XDEBUG_MODE=off php php artisan test --compact

      # Skip under nektos/act (ACT=true) so a local stack is not torn down.
      - name: Stop CI services
        if: ${{ always() && env.ACT == '' }}
        run: docker compose down --remove-orphans
