x-pxc-node: &pxc-node
    image: percona/percona-xtradb-cluster:8.0
    networks:
        - pxc-net
    healthcheck:
        test:
            [
                "CMD-SHELL",
                'mysql -h127.0.0.1 -uroot -proot -Nse "SHOW STATUS LIKE ''wsrep_local_state_comment'';" 2>/dev/null | grep -q Synced && mysql -h127.0.0.1 -uroot -proot -Nse "SHOW STATUS LIKE ''wsrep_cluster_status'';" 2>/dev/null | grep -q Primary',
            ]
        interval: 10s
        timeout: 5s
        retries: 30
        start_period: 90s

services:
    php:
        image: smart-invoice-guard/php:8.5
        hostname: php-fpm
        build:
            context: docker
            dockerfile: php.Dockerfile
            args:
                ELASTIC_APM_PHP_AGENT_VERSION: ${ELASTIC_APM_PHP_AGENT_VERSION:-1.17.0}
        volumes:
            - .:/var/www/html
            - php_data:/var/lib/php/volume/
            - ./docker/php.ini:/usr/local/etc/php/php.ini
            - ./docker/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-app.conf
        working_dir: /var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - 5173:5173
        environment:
            ELASTIC_APM_ENABLED: ${ELASTIC_APM_ENABLED:-true}
            ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-http://apm-server:8200}
            ELASTIC_APM_SERVICE_NAME: ${ELASTIC_APM_SERVICE_NAME:-smart-invoice-guard}
            ELASTIC_APM_SERVICE_VERSION: ${ELASTIC_APM_SERVICE_VERSION:-local}
            ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-local}
            ELASTIC_APM_LOG_LEVEL: ${ELASTIC_APM_LOG_LEVEL:-WARNING}
            ELASTIC_APM_LOG_LEVEL_STDERR: ${ELASTIC_APM_LOG_LEVEL_STDERR:-WARNING}
            ELASTIC_APM_GLOBAL_LABELS: ${ELASTIC_APM_GLOBAL_LABELS:-app=smart-invoice-guard,stack=local}
        depends_on:
            - proxysql
        networks:
            - app

    nginx:
        image: smart-invoice-guard/nginx:1.27
        hostname: nginx
        build:
            context: docker
            dockerfile: nginx.Dockerfile
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - 8080:8080
            - 8443:8443
        depends_on:
            - php
        networks:
            - app

    redis:
        image: redis:7.4-alpine
        hostname: redis
        volumes:
            - redis_data:/data
        networks:
            - app

    rabbitmq:
        image: rabbitmq:4.1-management-alpine
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: laravel
            RABBITMQ_DEFAULT_PASS: laravel
            RABBITMQ_DEFAULT_VHOST: /
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - app

    memcached:
        image: memcached:1.6-alpine
        hostname: memcached
        networks:
            - app

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
        hostname: elasticsearch
        environment:
            - discovery.type=single-node
            # Fleet / Integrations require security. Single-node allows HTTP without TLS.
            - xpack.security.enabled=true
            - xpack.security.http.ssl.enabled=false
            - xpack.security.transport.ssl.enabled=false
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - cluster.name=smart-invoice-guard
            - cluster.routing.allocation.disk.threshold_enabled=false
            - cluster.routing.allocation.disk.watermark.low=98%
            - cluster.routing.allocation.disk.watermark.high=99%
            - cluster.routing.allocation.disk.watermark.flood_stage=99%
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS -u elastic:${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 40s
        networks:
            - app

    kibana:
        image: docker.elastic.co/kibana/kibana:8.15.5
        hostname: kibana
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
            ELASTICSEARCH_USERNAME: kibana_system
            ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-changeme}
            TELEMETRY_ENABLED: "false"
            # Required for alerting / saved objects / Fleet session encryption.
            XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-localdevlocaldevlocaldevlocaldev12}
            XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-localdevlocaldevlocaldevlocaldev12}
            XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-localdevlocaldevlocaldevlocaldev12}
            # Served behind Nginx at /kibana/
            SERVER_BASEPATH: /kibana
            SERVER_REWRITEBASEPATH: "true"
            SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_BASE_URL:-https://localhost:8443/kibana}
        depends_on:
            elasticsearch:
                condition: service_healthy
            apm-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:5601/kibana/api/status || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 90s
        networks:
            - app

    apm-server:
        image: docker.elastic.co/apm/apm-server:8.15.5
        hostname: apm-server
        command: >
            apm-server -e --strict.perms=false
        environment:
            ELASTICSEARCH_USERNAME: elastic
            ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
            KIBANA_USERNAME: elastic
            KIBANA_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
        volumes:
            - ./docker/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
        depends_on:
            elasticsearch:
                condition: service_healthy
            apm-init:
                condition: service_completed_successfully
            kibana:
                condition: service_healthy
        # Official image often has no curl — probe the socket instead.
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8200'"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 20s
        networks:
            - app

    # Sets kibana_system password + creates .apm-* indices for central config / sourcemaps.
    apm-init:
        image: curlimages/curl:8.12.1
        environment:
            ELASTICSEARCH_HOST: http://elasticsearch:9200
            ELASTICSEARCH_USERNAME: elastic
            ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
            KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-changeme}
        volumes:
            - ./docker/apm-init.sh:/apm-init.sh:ro
        entrypoint: ["/bin/sh", "/apm-init.sh"]
        depends_on:
            elasticsearch:
                condition: service_healthy
        restart: "no"
        networks:
            - app

    mailhog:
        image: mailhog/mailhog:latest
        hostname: mailhog
        # ports:
        #     - 8025:8025
        networks:
            - app

    pxc-node1:
        <<: *pxc-node
        hostname: pxc-node1
        # Force safe_to_bootstrap on the designated bootstrap node so a simultaneous
        # compose down/kill of the whole cluster can recover without manual grastate edits.
        entrypoint: ["/bin/bash", "/pxc-node1-entrypoint.sh"]
        command: ["mysqld"]
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            CLUSTER_NAME: smart-invoice-guard
            XTRABACKUP_PASSWORD: xtrabackup
        volumes:
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
            - ./docker/pxc-node1-entrypoint.sh:/pxc-node1-entrypoint.sh:ro
            - pxc_data_node1:/var/lib/mysql

    pxc-node2:
        <<: *pxc-node
        hostname: pxc-node2
        environment:
            MYSQL_ROOT_PASSWORD: root
            CLUSTER_NAME: smart-invoice-guard
            CLUSTER_JOIN: pxc-node1
            XTRABACKUP_PASSWORD: xtrabackup
        restart: on-failure
        volumes:
            # Must keep pxc.cnf mount — overriding volumes drops the anchor mounts.
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
            - pxc_data_node2:/var/lib/mysql
        depends_on:
            pxc-node1:
                condition: service_healthy

    pxc-node3:
        <<: *pxc-node
        hostname: pxc-node3
        environment:
            MYSQL_ROOT_PASSWORD: root
            CLUSTER_NAME: smart-invoice-guard
            CLUSTER_JOIN: pxc-node1
            XTRABACKUP_PASSWORD: xtrabackup
        restart: on-failure
        volumes:
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
            - pxc_data_node3:/var/lib/mysql
        depends_on:
            pxc-node1:
                condition: service_healthy

    # App connects here as DB_HOST=mariadb / DB_PORT=3306
    proxysql:
        image: proxysql/proxysql:2.5.5
        hostname: mariadb
        volumes:
            - ./docker/proxysql.cnf:/etc/proxysql.cnf:ro
        depends_on:
            pxc-node1:
                condition: service_healthy
            pxc-node2:
                condition: service_healthy
            pxc-node3:
                condition: service_healthy
        networks:
            app:
                aliases:
                    - mariadb
            pxc-net:

    # Performance / regression tests — `docker compose --profile k6 run --rm k6 ...`
    # Joins the app network so CI can hit https://nginx:8443 without publishing host ports.
    k6:
        image: grafana/k6:1.8.0
        profiles: ["k6"]
        working_dir: /scripts
        volumes:
            - ./tests/k6:/scripts:ro
            - ./tests/k6/results:/results
        environment:
            K6_BASE_URL: ${K6_BASE_URL:-https://nginx:8443}
            K6_EMAIL: ${K6_EMAIL:-k6@example.com}
            K6_PASSWORD: ${K6_PASSWORD:-password}
            K6_API_TOKEN: ${K6_API_TOKEN:-}
        networks:
            - app

volumes:
    php_data:
    redis_data:
    rabbitmq_data:
    elasticsearch_data:
    pxc_data_node1:
    pxc_data_node2:
    pxc_data_node3:

networks:
    app:
    pxc-net:
        driver: bridge
