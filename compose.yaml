x-pxc-node: &pxc-node
    image: percona/percona-xtradb-cluster:8.0
    networks:
        - pxc-net
    healthcheck:
        test:
            [
                "CMD-SHELL",
                'mysql -h127.0.0.1 -uroot -proot -Nse "SHOW STATUS LIKE ''wsrep_local_state_comment'';" 2>/dev/null | grep -q Synced && mysql -h127.0.0.1 -uroot -proot -Nse "SHOW STATUS LIKE ''wsrep_cluster_status'';" 2>/dev/null | grep -q Primary',
            ]
        interval: 10s
        timeout: 5s
        retries: 30
        start_period: 90s

services:
    php:
        image: smart-invoice-guard/php:8.5
        hostname: php-fpm
        build:
            context: docker
            dockerfile: php.Dockerfile
        volumes:
            - .:/var/www/html
            - php_data:/var/lib/php/volume/
            - ./docker/php.ini:/usr/local/etc/php/php.ini
        working_dir: /var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - 5173:5173
        depends_on:
            - proxysql
        networks:
            - app

    httpd:
        image: smart-invoice-guard/httpd:2.4
        build:
            context: docker
            dockerfile: httpd.Dockerfile
        volumes:
            - .:/var/www/html
            - ./docker/httpd.conf:/usr/local/apache2/conf/httpd.conf
            - ./docker/default.conf:/usr/local/apache2/sites/default.conf
            - php_data:/var/lib/php/volume/
        working_dir: /var/www/html
        ports:
            - 8080:8080
            - 8443:8443
        depends_on:
            - php
        networks:
            - app

    redis:
        image: redis:7.4-alpine
        hostname: redis
        volumes:
            - redis_data:/data
        networks:
            - app

    memcached:
        image: memcached:1.6-alpine
        hostname: memcached
        networks:
            - app

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
        hostname: elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - xpack.security.http.ssl.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - cluster.name=smart-invoice-guard
            - cluster.routing.allocation.disk.threshold_enabled=false
            - cluster.routing.allocation.disk.watermark.low=98%
            - cluster.routing.allocation.disk.watermark.high=99%
            - cluster.routing.allocation.disk.watermark.flood_stage=99%
        volumes:
            - elasticsearch_data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:9200/_cluster/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 40s
        networks:
            - app

    mailhog:
        image: mailhog/mailhog:latest
        hostname: mailhog
        ports:
            - 8025:8025
        networks:
            - app

    pxc-node1:
        <<: *pxc-node
        hostname: pxc-node1
        container_name: pxc-node1
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            CLUSTER_NAME: smart-invoice-guard
            XTRABACKUP_PASSWORD: xtrabackup
        volumes:
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
            - pxc_data_node1:/var/lib/mysql

    pxc-node2:
        <<: *pxc-node
        hostname: pxc-node2
        container_name: pxc-node2
        environment:
            MYSQL_ROOT_PASSWORD: root
            CLUSTER_NAME: smart-invoice-guard
            CLUSTER_JOIN: pxc-node1
            XTRABACKUP_PASSWORD: xtrabackup
        restart: on-failure
        volumes:
            # Must keep pxc.cnf mount — overriding volumes drops the anchor mounts.
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
        depends_on:
            pxc-node1:
                condition: service_healthy

    pxc-node3:
        <<: *pxc-node
        hostname: pxc-node3
        container_name: pxc-node3
        environment:
            MYSQL_ROOT_PASSWORD: root
            CLUSTER_NAME: smart-invoice-guard
            CLUSTER_JOIN: pxc-node1
            XTRABACKUP_PASSWORD: xtrabackup
        restart: on-failure
        volumes:
            - ./docker/pxc.cnf:/etc/percona-xtradb-cluster.conf.d/pxc.cnf:ro
        depends_on:
            pxc-node1:
                condition: service_healthy

    # App connects here as DB_HOST=mariadb / DB_PORT=3306
    proxysql:
        image: proxysql/proxysql:2.5.5
        hostname: mariadb
        container_name: pxc-proxysql
        volumes:
            - ./docker/proxysql.cnf:/etc/proxysql.cnf:ro
        depends_on:
            pxc-node1:
                condition: service_healthy
            pxc-node2:
                condition: service_healthy
            pxc-node3:
                condition: service_healthy
        networks:
            app:
                aliases:
                    - mariadb
            pxc-net:

volumes:
    php_data:
    redis_data:
    elasticsearch_data:
    pxc_data_node1:

networks:
    app:
    pxc-net:
        driver: bridge
