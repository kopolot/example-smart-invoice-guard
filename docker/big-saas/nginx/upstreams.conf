# Big SaaS — Nginx upstreams: wiele pul PHP-FPM + routing po X-Tenant-Tier.
#
# Tier → upstream:
#   normal     → php-shared (round-robin 2 repliki)
#   premium    → php-premium-{1|2|3} (nagłówek X-Premium-Cluster)
#   enterprise → php-enterprise-{N}

upstream php-shared {
    least_conn;
    server php-shared-1:9000 weight=1 max_conns=256;
    server php-shared-2:9000 weight=1 max_conns=256;
    keepalive 64;
}

upstream php-premium-1 {
    server php-premium-1:9000 max_conns=128;
    keepalive 32;
}

upstream php-premium-2 {
    server php-premium-2:9000 max_conns=128;
    keepalive 32;
}

upstream php-premium-3 {
    server php-premium-3:9000 max_conns=128;
    keepalive 32;
}

upstream php-enterprise-1 {
    least_conn;
    server php-enterprise-1a:9000 max_conns=64;
    server php-enterprise-1b:9000 max_conns=64;
    server php-enterprise-1c:9000 max_conns=64;
    keepalive 32;
}

# Map tier + premium shard → PHP-FPM upstream
map "$http_x_tenant_tier:$http_x_premium_cluster" $php_fastcgi_upstream {
    default     php-shared;
    "normal:"   php-shared;
    "premium:1" php-premium-1;
    "premium:2" php-premium-2;
    "premium:3" php-premium-3;
    "premium:"  php-premium-1;
    "enterprise:" php-enterprise-1;
}

upstream reverb {
    server php-shared-1:8080;
    keepalive 8;
}
