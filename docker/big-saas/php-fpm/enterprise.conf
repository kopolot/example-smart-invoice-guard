; Enterprise — dedykowany pool, najwyższe limity
[www-enterprise]
user = container
group = container
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 96
pm.start_servers = 16
pm.min_spare_servers = 12
pm.max_spare_servers = 32
pm.max_requests = 2000
pm.status_path = /status-enterprise

request_terminate_timeout = 300
