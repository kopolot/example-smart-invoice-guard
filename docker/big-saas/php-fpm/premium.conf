; Premium tier — wyższy throughput, dłuższe requesty (PDF, import)
[www-premium]
user = container
group = container
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 48
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 16
pm.max_requests = 1000
pm.status_path = /status-premium

request_terminate_timeout = 180
