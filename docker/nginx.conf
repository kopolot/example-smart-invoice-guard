user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 100M;

    # Per-IP request rate limiting (shared memory zones; used in conf.d)
    # Empty map value skips the zone — API gets an extra, stricter bucket.
    map $request_uri $limit_req_api {
        default "";
        ~^/api/ $binary_remote_addr;
    }

    limit_req_zone $binary_remote_addr zone=perip:10m rate=250r/s;
    limit_req_zone $limit_req_api zone=api:10m rate=150r/s;
    limit_req_status 429;

    # WebSocket Connection header (only upgrade when client asks)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Strip /rabbitmq prefix from the raw request URI (keeps %2F for RabbitMQ default vhost)
    map $request_uri $rabbitmq_request_uri {
        ~^/rabbitmq(?<rmq_path>/api/.*)$ $rmq_path;
        default $request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # Faster static file serving (Vite /build, favicon, etc.)
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    include /etc/nginx/conf.d/*.conf;
}
